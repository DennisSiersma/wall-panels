# =====================================================================
# Waveshare ESP32-S3 Touch-LCD-4 wandpaneel - GEDEELDE BASIS (package)
# Geincludeerd door waveshare-panel-1.yaml / -2.yaml, die alleen de
# substitutions invullen (device_name, friendly_name, room_name,
# rwv_server, dashboard_url).
#
# Vereist in secrets.yaml: wifi_ssid, wifi_password, api_key,
# ota_password, ap_password.
# =====================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    then:
      - delay: 1s
      - light.turn_on:
          id: display_backlight
          brightness: 70%
      - delay: 500ms
      # RTC vullen bij boot als HA-tijd al beschikbaar is
      - if:
          condition:
            time.has_time:
              id: homeassistant_time
          then:
            - lambda: |-
                id(pcf85063_time).write_time();

external_components:
  # Let op: dit zijn nog-niet-gemergede ESPHome PR-branches (refresh 1h pakt
  # steeds de laatste stand). Voor maximale stabiliteit kun je pinnen op een
  # vaste commit i.p.v. de PR-branch.
  - source: github://pr#10071
    components: [waveshare_io_ch32v003]
    refresh: 1h
  - source: github://pr#14358
    components: [gt911]
    refresh: 1h
  - source: github://strange-v/RemoteWebViewClient@main
    components: [remote_webview]
    refresh: 0s

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
    components:
      - name: espressif/esp_websocket_client
        ref: 1.5.0
      - name: espressif/esp-dsp
        ref: 1.7.0
      - name: bitbank2/jpegdec
        source: https://github.com/strange-v/jpegdec-esphome

preferences:
  flash_write_interval: 1min

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  # Niet herstarten als de HA-verbinding even wegvalt (wandpaneel).
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# ==================================================
# Reset button
# ==================================================
button:
  - platform: restart
    name: "${room_name} herstart"
    id: panel_herstart

# ==================================================
# I2C
# ==================================================
i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO7
    scan: true
    frequency: 400kHz

# ==================================================
# RTC
# ==================================================
time:
  - platform: pcf85063
    id: pcf85063_time
    i2c_id: bus_a
    update_interval: never
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - lambda: |-
            id(pcf85063_time).write_time();

# ==================================================
# SPI
# ==================================================
spi:
  - id: spi0
    clk_pin: GPIO2
    mosi_pin: GPIO1

# ==================================================
# Waveshare IO Expander
# ==================================================
waveshare_io_ch32v003:
  - id: wave_io_hub
    address: 0x24
    i2c_id: bus_a

# ==================================================
# Outputs
# ==================================================
output:
  - platform: waveshare_io_ch32v003
    id: wave_io_pwm_output
    waveshare_io_ch32v003_id: wave_io_hub
    inverted: true
    zero_means_zero: true
    safe_pwm_levels:
      min_value: 0
      max_value: 247

# ==================================================
# Buzzer Switch
# ==================================================
switch:
  - platform: gpio
    name: "Onboard Buzzer"
    id: board_buzzer
    pin:
      waveshare_io_ch32v003: wave_io_hub
      number: 6
      mode:
        output: true
      inverted: false

# ==================================================
# Backlight
# ==================================================
light:
  - platform: monochromatic
    name: "Display Backlight"
    id: display_backlight
    output: wave_io_pwm_output
    restore_mode: ALWAYS_ON
    default_transition_length: 1s

# ==================================================
# Display
# ==================================================
display:
  - platform: mipi_rgb
    id: lcd_display
    model: WAVESHARE-4-480x480
    rotation: 180
    reset_pin:
      waveshare_io_ch32v003: wave_io_hub
      number: 3
    pixel_mode: 18bit
    init_sequence:
      - [0x11, 0x00]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0D, 0x02]
      - [0xC2, 0x21, 0x08]
      - [0xCD, 0x08]
      - [0xB0, 0x00, 0x11, 0x18, 0x0E, 0x11, 0x06, 0x07, 0x08, 0x07, 0x22, 0x04, 0x12, 0x0F, 0xAA, 0x31, 0x18]
      - [0xB1, 0x00, 0x11, 0x19, 0x0E, 0x12, 0x07, 0x08, 0x08, 0x08, 0x22, 0x04, 0x11, 0x11, 0xA9, 0x32, 0x18]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x60]
      - [0xB1, 0x30]
      - [0xB2, 0x87]
      - [0xB3, 0x80]
      - [0xB5, 0x49]
      - [0xB7, 0x85]
      - [0xB8, 0x21]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - delay 20ms
      - [0xE0, 0x00, 0x1B, 0x02]
      - [0xE1, 0x08, 0xA0, 0x00, 0x00, 0x07, 0xA0, 0x00, 0x00, 0x00, 0x44, 0x44]
      - [0xE2, 0x11, 0x11, 0x44, 0x44, 0xED, 0xA0, 0x00, 0x00, 0xEC, 0xA0, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x11]
      - [0xE4, 0x44, 0x44]
      - [0xE5, 0x0A, 0xE9, 0xD8, 0xA0, 0x0C, 0xEB, 0xD8, 0xA0, 0x0E, 0xED, 0xD8, 0xA0, 0x10, 0xEF, 0xD8, 0xA0]
      - [0xE6, 0x00, 0x00, 0x11, 0x11]
      - [0xE7, 0x44, 0x44]
      - [0xE8, 0x09, 0xE8, 0xD8, 0xA0, 0x0B, 0xEA, 0xD8, 0xA0, 0x0D, 0xEC, 0xD8, 0xA0, 0x0F, 0xEE, 0xD8, 0xA0]
      - [0xEB, 0x02, 0x00, 0xE4, 0xE4, 0x88, 0x00, 0x40]
      - [0xEC, 0x3C, 0x00]
      - [0xED, 0xAB, 0x89, 0x76, 0x54, 0x02, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x20, 0x45, 0x67, 0x98, 0xBA]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]

# ==================================================
# Touchscreen
# ==================================================
touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: bus_a
    display: lcd_display
    update_interval: 30ms
    interrupt_pin:
      waveshare_io_ch32v003: wave_io_hub
      number: 2
    reset_pin:
      waveshare_io_ch32v003: wave_io_hub
      number: 1

# ==================================================
# Remote WebView
# ==================================================
remote_webview:
  id: rwv
  display_id: lcd_display
  touchscreen_id: touch_panel
  device_id: ${device_name}
  server: "${rwv_server}"
  url: "${dashboard_url}"
  tile_size: 64
  full_frame_tile_count: 1
  full_frame_area_threshold: 0.40
  full_frame_every: 60
  every_nth_frame: 2
  min_frame_interval: 200
  jpeg_quality: 70
  max_bytes_per_msg: 49152

# ==================================================
# URL entity
# ==================================================
text:
  - platform: template
    id: rwv_url
    name: "Dashboard URL ${friendly_name}"
    optimistic: true
    mode: TEXT
    set_action:
      - lambda: |-
          if (!id(rwv).open_url(std::string(x.c_str()))) {
            id(rwv).set_url(std::string(x.c_str()));
            ESP_LOGI("remote_webview", "URL queued (not connected): %s", x.c_str());
          }
