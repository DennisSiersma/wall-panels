# =====================================================================
# Waveshare ESP32-S3 Touch-LCD-7 (rev 1.x, 800x480) - GEDEELDE BASIS
# Zelfde opzet als common/waveshare-panel.yaml (4"), maar andere hardware:
#   - IO-expander: CH422G (zit in ESPHome core -> GEEN externe PR nodig)
#   - Display: mipi_rgb, model ESP32-S3-TOUCH-LCD-7-800X480, pclk 16MHz
#     (hoger dan 16MHz geeft flikkerende pixels op dit board)
#   - Backlight: ALLEEN aan/uit via CH422G EXIO2 (rev 1.x kan niet dimmen)
#   - Geen RTC-chip, geen buzzer op dit board
# Vereist ESPHome >= 2026.4 (mipi_rgb-modelnaam).
# Vereist in secrets.yaml: wifi_ssid, wifi_password, api_key,
# ota_password, ap_password.
# Hardware-referentie: agillis/esphome-modular-lvgl-buttons
# =====================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_upload.maximum_ram_size: 524288
  on_boot:
    then:
      - delay: 1s
      - switch.turn_on: lcd_backlight

external_components:
  # Alleen remote_webview is hier extern; de CH422G zit in core.
  - source: github://strange-v/RemoteWebViewClient@main
    components: [remote_webview]
    refresh: 0s

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
    # Nodig voor remote_webview (websocket + jpeg-decoder).
    components:
      - name: espressif/esp_websocket_client
        ref: 1.5.0
      - name: espressif/esp-dsp
        ref: 1.7.0
      - name: bitbank2/jpegdec
        source: https://github.com/strange-v/jpegdec-esphome

preferences:
  flash_write_interval: 1min

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# ==================================================
# Reset button
# ==================================================
button:
  - platform: restart
    name: "${room_name} herstart"
    id: panel_herstart

# ==================================================
# I2C (touch + CH422G)  - LET OP: andere pinnen dan de 4"!
# ==================================================
i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true
    frequency: 400kHz

# ==================================================
# Tijd (geen RTC-chip op dit board; HA-tijd volstaat)
# ==================================================
time:
  - platform: homeassistant
    id: homeassistant_time

# ==================================================
# CH422G IO-expander (core component)
# ==================================================
ch422g:
  - id: ch422g_hub
    i2c_id: bus_a

# ==================================================
# Backlight - alleen aan/uit (EXIO2). Dimmen kan niet op rev 1.x.
# ==================================================
switch:
  - platform: gpio
    name: "Display Backlight"
    id: lcd_backlight
    restore_mode: ALWAYS_ON
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false

# ==================================================
# Display (RGB-parallel, 800x480)
# ==================================================
display:
  - platform: mipi_rgb
    id: lcd_display
    model: ESP32-S3-TOUCH-LCD-7-800X480
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    de_pin:
      number: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]

# ==================================================
# Touchscreen (GT911; interrupt direct op GPIO4, reset via CH422G)
# Klopt de aanraakpositie niet (gespiegeld/gedraaid)? Speel dan met:
#   transform: { swap_xy: true/false, mirror_x: ..., mirror_y: ... }
# ==================================================
touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: bus_a
    display: lcd_display
    update_interval: 30ms
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: ch422g_hub
      number: 1
      mode: OUTPUT

# ==================================================
# Remote WebView (zelfde instellingen als de 4"-panelen)
# ==================================================
remote_webview:
  id: rwv
  display_id: lcd_display
  touchscreen_id: touch_panel
  device_id: ${device_name}
  server: "${rwv_server}"
  url: "${dashboard_url}"
  tile_size: 64
  full_frame_tile_count: 1
  full_frame_area_threshold: 0.40
  full_frame_every: 60
  every_nth_frame: 2
  min_frame_interval: 200
  jpeg_quality: 70
  max_bytes_per_msg: 49152

# ==================================================
# URL entity
# ==================================================
text:
  - platform: template
    id: rwv_url
    name: "Dashboard URL ${friendly_name}"
    optimistic: true
    mode: TEXT
    set_action:
      - lambda: |-
          if (!id(rwv).open_url(std::string(x.c_str()))) {
            id(rwv).set_url(std::string(x.c_str()));
            ESP_LOGI("remote_webview", "URL queued (not connected): %s", x.c_str());
          }
